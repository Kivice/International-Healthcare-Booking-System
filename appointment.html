<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Appointment Form - International Healthcare Booking System</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header style="background-image: url('https://media.istockphoto.com/id/1421323821/vector/circle-with-transition-line-elements-from-white-to-black-abstract-geometric-art-line.jpg?s=1024x1024&w=is&k=20&c=bwDYL6JbbYhh5A_4qeTHYhRvHOhdaFpPmRGSsmVJW2s='); background-size: cover; background-position: center; padding: 20px; text-align: center;">
            <h1>International Healthcare Booking System</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="services.html">Services</a>
                <a href="meet.html">Our Team</a>
                <a href="testimonials.html">Testimonials</a>
                <a href="appointment.html">Book Appointment</a>
            </nav>
        </header>
        <section id="appointment">
            <h2>Book an Appointment</h2>
            <form action="submit_appointment.php" method="post">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
                
                <label for="doctor">Select Doctor:</label>
                <select id="doctor" name="doctor" required>
                    <option value="Dr. John Doe">Dr. John Doe - Chief Medical Officer</option>
                    <option value="Dr. Jane Smith">Dr. Jane Smith - Senior Surgeon</option>
                    <option value="Dr. Emily Johnson">Dr. Emily Johnson - Pediatric Specialist</option>
                    <option value="Dr. Michael Brown">Dr. Michael Brown - Cardiologist</option>
                </select>
                
                <label for="date">Preferred Appointment Date:</label>
                <input type="date" id="date" name="date" required>
                
                <label for="time">Preferred Appointment Time:</label>
                <input type="time" id="time" name="time" required>
                
                <label for="message">Additional Notes:</label>
                <textarea id="message" name="message" rows="4"></textarea>
                
                <button type="submit">Submit</button>
            </form>
        </section>
        <footer>
            <p>&copy; 2023 International Healthcare Booking System. All rights reserved.</p>
        </footer>
    </body>
</html>
